# Enable PodCertificateRequest and ClusterTrustBundle APIs on Kubernetes 1.36.
# Required by Agent Substrate (substrate-podcert / ate-system).
cluster:
  apiServer:
    extraArgs:
      feature-gates: ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
      runtime-config: certificates.k8s.io/v1beta1=true
  controllerManager:
    extraArgs:
      feature-gates: ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
machine:
  kubelet:
    extraArgs:
      feature-gates: ClusterTrustBundle=true,ClusterTrustBundleProjection=true,PodCertificateRequest=true
