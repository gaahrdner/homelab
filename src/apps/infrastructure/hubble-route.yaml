apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  namespace: kube-system
spec:
  parentRefs:
  - name: internal
    namespace: gateway
  hostnames:
  - "hubble.internal"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: "0s"
      backendRequest: "0s"
    backendRefs:
    - name: hubble-ui
      port: 80
