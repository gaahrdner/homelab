apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vpa
  namespace: argocd
spec:
  project: default
  source:
    chart: vertical-pod-autoscaler
    repoURL: https://kubernetes.github.io/autoscaler
    targetRevision: 0.17.0
    helm:
      valuesObject:
        crds:
          enabled: true
          keep: true

        # Recommendation-only (Off) mode: run recommender only.
        # To enable active K8s 1.36 InPlaceOrRecreate resizing later, enable
        # updater + admissionController and set featureGates.InPlaceOrRecreate: true.
        recommender:
          enabled: true
          replicas: 1
          podDisruptionBudget:
            enabled: false
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi

        updater:
          enabled: false

        admissionController:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: vpa

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
