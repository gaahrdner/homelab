# External routes to Docker services running on bifrost.internal (192.168.0.147).
# Exposes *.internal hostnames through Gateway/internal (192.168.0.203) so external-dns
# creates UniFi DNS records automatically and Tailscale clients can reach them without
# advertising bifrost's LAN IP directly.
apiVersion: v1
kind: Service
metadata:
  name: bifrost
  namespace: gateway
spec:
  type: ClusterIP
  ports:
    - name: sonarr
      port: 8989
      targetPort: 8989
      protocol: TCP
    - name: radarr
      port: 7878
      targetPort: 7878
      protocol: TCP
    - name: bazarr
      port: 6767
      targetPort: 6767
      protocol: TCP
    - name: sabnzbd
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: tautulli
      port: 8181
      targetPort: 8181
      protocol: TCP
    - name: plex
      port: 32400
      targetPort: 32400
      protocol: TCP
    - name: dockhand
      port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: bifrost-1
  namespace: gateway
  labels:
    kubernetes.io/service-name: bifrost
addressType: IPv4
ports:
  - name: sonarr
    port: 8989
    protocol: TCP
  - name: radarr
    port: 7878
    protocol: TCP
  - name: bazarr
    port: 6767
    protocol: TCP
  - name: sabnzbd
    port: 8080
    protocol: TCP
  - name: tautulli
    port: 8181
    protocol: TCP
  - name: plex
    port: 32400
    protocol: TCP
  - name: dockhand
    port: 3000
    protocol: TCP
endpoints:
  - addresses:
      - 192.168.0.147
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: gateway
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - sonarr.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bifrost
          port: 8989
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: gateway
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - radarr.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bifrost
          port: 7878
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
  namespace: gateway
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - bazarr.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bifrost
          port: 6767
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sabnzbd
  namespace: gateway
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - sabnzbd.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: bifrost.internal
      backendRefs:
        - name: bifrost
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tautulli
  namespace: gateway
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - tautulli.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: bifrost
          port: 8181
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: plex
  namespace: gateway
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - plex.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: bifrost
          port: 32400
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dockhand
  namespace: gateway
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - dockhand.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: bifrost
          port: 3000
