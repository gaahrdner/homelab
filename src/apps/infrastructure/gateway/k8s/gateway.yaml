apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: internal-gateway-config
  namespace: gateway
spec:
  description: Internal GatewayClass config with gRPC-Web passthrough
  httpOptions:
    grpcWebTranslation:
      enabled: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-internal
spec:
  controllerName: io.cilium/gateway-controller
  description: Cilium GatewayClass for internal HTTP services
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: internal-gateway-config
    namespace: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: gateway
  annotations:
    io.cilium/lb-ipam-ips: "192.168.0.202"
spec:
  gatewayClassName: cilium-internal
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
