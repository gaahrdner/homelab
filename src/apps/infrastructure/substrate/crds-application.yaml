apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: substrate-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: ghcr.io/kagent-dev/substrate/helm
    chart: substrate-crds
    targetRevision: 1.0.1
    helm:
      releaseName: substrate-crds

  destination:
    server: https://kubernetes.default.svc
    namespace: ate-system

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
