---
# 1Password Item reference for GitHub Container Registry (GHCR) image pull credentials
# IMPORTANT: Create an item named "ghcr-pull-secret" in the 1Password kubernetes vault
# (vault ID: mbn7rk3d5gfgofrv3a2zt2tdoe) with a single field named:
#
#   Field name:  .dockerconfigjson
#   Field value: (raw JSON, NOT base64-encoded):
#     {"auths":{"ghcr.io":{"username":"gaahrdner","password":"<GITHUB_PAT_WITH_READ_PACKAGES>","auth":"<BASE64(gaahrdner:PAT)>"}}}
#
apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: ghcr-pull-secret
  namespace: texasdust
type: kubernetes.io/dockerconfigjson
spec:
  itemPath: "vaults/mbn7rk3d5gfgofrv3a2zt2tdoe/items/ghcr-pull-secret"
