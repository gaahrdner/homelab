apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-bootstrap
  namespace: hermes
data:
  config.yaml: |
    model:
      default: "gx10-fast"
      provider: "custom:litellm"
      base_url: "http://litellm.litellm.svc.cluster.local:4000/v1"

    providers:
      litellm:
        name: "LiteLLM (GX10)"
        base_url: "http://litellm.litellm.svc.cluster.local:4000/v1"
        key_env: "OPENAI_API_KEY"
        api_mode: "chat_completions"
        default_model: "gx10-fast"
        discover_models: true
        models:
          gx10-fast:
            context_length: 262144
          gx10-coding:
            context_length: 262144
          gx10-coding-abliterated:
            context_length: 262144
          gx10-fast-abliterated:
            context_length: 262144
          gx10-huihui-abliterated:
            context_length: 262144
          gx10-nemotron:
            context_length: 1048576
          gx10-gemma4:
            context_length: 262144
          gx10-qwen36-fast:
            context_length: 262144
          gx10-qwen38-next-1m:
            context_length: 1000000
          gx10-qwen38-next:
            context_length: 262144
          gx10-glm53:
            context_length: 512000

    mcp_servers:
      litellm:
        url: "http://litellm.litellm.svc.cluster.local:4000/mcp/"
        headers:
          Authorization: "Bearer ${OPENAI_API_KEY}"
        timeout: 300
