# Additional GX10 ModelConfigs routed through litellm.internal.
# default-model-config (gx10-fast) is managed by the kagent Helm chart.
apiVersion: api.kagent.dev/v1alpha3
kind: ModelConfig
metadata:
  name: gx10-coding
  namespace: kagent
spec:
  provider: OpenAI
  model: gx10-coding
  apiKeySecret: litellm-master-key
  apiKeySecretKey: master-key
  stream: true
  openAI:
    apiFormat: chatCompletions
    baseUrl: http://litellm.litellm.svc.cluster.local:4000/v1
---
