apiVersion: v1
kind: Service
metadata:
  name: kagent-controller-grpc
  namespace: kagent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/component: controller
    app.kubernetes.io/instance: kagent
    app.kubernetes.io/name: kagent
  ports:
    - name: grpc
      port: 8083
      targetPort: 8083
      appProtocol: kubernetes.io/h2c
