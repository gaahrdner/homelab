apiVersion: api.kagent.dev/v1alpha3
kind: RemoteMCPServer
metadata:
  name: litellm-mcp
  namespace: kagent
spec:
  description: LiteLLM unified MCP Gateway (GX10 tools, Arr media stack, FastList, and any MCP servers managed in LiteLLM)
  protocol: STREAMABLE_HTTP
  sseReadTimeout: 5m0s
  terminateOnClose: true
  timeout: 5m0s
  url: http://litellm.litellm.svc.cluster.local:4000/mcp/
  headersFrom:
    - name: Authorization
      valueFrom:
        type: Secret
        name: litellm-master-key
        key: master-key
