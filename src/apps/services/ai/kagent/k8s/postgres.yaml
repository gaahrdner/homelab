apiVersion: v1
kind: ConfigMap
metadata:
  name: kagent-postgres-init
  namespace: kagent
data:
  01-kagent-setup.sh: |
    #!/bin/sh
    set -eu
    psql -v ON_ERROR_STOP=1 --no-psqlrc --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" \
      --command='\getenv owner_pw KAGENT_OWNER_PASSWORD' <<'SQL'
    CREATE ROLE kagent_owner_user LOGIN PASSWORD :'owner_pw';
    ALTER DATABASE kagent OWNER TO kagent_owner_user;
    ALTER SCHEMA public OWNER TO kagent_owner_user;
    SQL
---
apiVersion: v1
kind: Service
metadata:
  name: kagent-postgresql
  namespace: kagent
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kagent-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kagent-postgresql
  namespace: kagent
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: kagent-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kagent-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kagent-postgresql
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: kagent
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kagent-postgresql
                  key: postgres-password
            - name: KAGENT_OWNER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kagent-postgresql
                  key: owner-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/01-kagent-setup.sh
              subPath: 01-kagent-setup.sh
              readOnly: true
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - kagent
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - kagent
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: init-script
          configMap:
            name: kagent-postgres-init
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
