apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kagent
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: ghcr.io/kagent-dev/kagent/helm
      chart: kagent
      targetRevision: 0.10.6
      helm:
        releaseName: kagent
        valuesObject:
          annotations:
            reloader.stakater.com/auto: "true"
          database:
            postgres:
              bundled:
                enabled: false
              urlFile: /etc/kagent-db/ownerConnectionString
          providers:
            default: openAI
            openAI:
              provider: OpenAI
              model: ds4-plan
              apiKeySecretRef: litellm-master-key
              apiKeySecretKey: master-key
              config:
                baseUrl: http://litellm.litellm.svc.cluster.local:4000/v1
          controller:
            volumes:
              - name: kagent-db-url
                secret:
                  secretName: kagent-postgresql
                  items:
                    - key: ownerConnectionString
                      path: ownerConnectionString
            volumeMounts:
              - name: kagent-db-url
                mountPath: /etc/kagent-db
                readOnly: true
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 1000m
                memory: 512Mi
          ui:
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi
          kagent-tools:
            enabled: true
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 256Mi
          k8s-agent:
            enabled: true
          kgateway-agent:
            enabled: false
          istio-agent:
            enabled: false
          promql-agent:
            enabled: false
          observability-agent:
            enabled: false
          argo-rollouts-agent:
            enabled: false
          helm-agent:
            enabled: false
          cilium-policy-agent:
            enabled: false
          cilium-manager-agent:
            enabled: false
          cilium-debug-agent:
            enabled: false
          grafana-mcp:
            enabled: false
    - repoURL: https://github.com/gaahrdner/homelab.git
      targetRevision: HEAD
      path: src/apps/services/ai/kagent/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: kagent

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
