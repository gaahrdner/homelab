apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    # LiteLLM proxy config for litellm.internal.
    # Backed by litellm-postgresql so the Admin UI (/ui, /v2/model/info) and DB-persisted model edits work.
    # Managed via the web control panel at http://freki.internal:8080 (Split Dual-Lane vs Linked TP=2).

    model_list:
      # --- Split Dual-Lane: Dedicated Coding Workhorse (geri:8000) ---
      - model_name: gx10-coding
        litellm_params:
          model: openai/nvidia/Qwen3.8-27B-NVFP4
          api_base: http://geri.internal:8000/v1
          api_key: "EMPTY"

      # --- Split Dual-Lane: Fast Chat / Reasoning / Vision (freki:8000) ---
      - model_name: gx10-fast
        litellm_params:
          model: openai/thinkingmachines/Inkling-2-Mini
          api_base: http://freki.internal:8000/v1
          api_key: "EMPTY"

      # --- Split Security & Uncensored (geri:8000 + freki:8000) ---
      - model_name: gx10-coding-abliterated
        litellm_params:
          model: openai/HangGlidersRule/Darkstar-Qwen3.8-27B-Abliterated-ModelOpt-W4A16-NVFP4-Mixed-FP8
          api_base: http://geri.internal:8000/v1
          api_key: "EMPTY"

      - model_name: gx10-fast-abliterated
        litellm_params:
          model: openai/mrfakename/Inkling-2-Mini-abliterated
          api_base: http://freki.internal:8000/v1
          api_key: "EMPTY"

      - model_name: gx10-huihui-abliterated
        litellm_params:
          model: openai/sakamakismile/Huihui-Qwen3.8-27B-abliterated-NVFP4
          api_base: http://geri.internal:8000/v1
          api_key: "EMPTY"

      # --- Split Dual-Lane Alternates (when swapped via Web Control Panel) ---
      - model_name: gx10-nemotron
        litellm_params:
          model: openai/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
          api_base: http://geri.internal:8000/v1
          api_key: "EMPTY"

      - model_name: gx10-gemma4
        litellm_params:
          model: openai/nvidia/Gemma-4-26B-A4B-NVFP4
          api_base: http://freki.internal:8000/v1
          api_key: "EMPTY"

      - model_name: gx10-qwen36-fast
        litellm_params:
          model: openai/nvidia/Qwen3.6-35B-A3B-NVFP4
          api_base: http://freki.internal:8000/v1
          api_key: "EMPTY"

      # --- Linked TP=2 Frontier Modes (served on freki:8000 across both GX10s) ---
      - model_name: gx10-qwen38-next-1m
        litellm_params:
          model: openai/RadixArk/Qwen3.8-Flash-Next-NVFP4
          api_base: http://freki.internal:8000/v1
          api_key: "EMPTY"

      - model_name: gx10-qwen38-next
        litellm_params:
          model: openai/nvidia/Qwen3.8-Flash-Next-FP4-Local
          api_base: http://freki.internal:8000/v1
          api_key: "EMPTY"

      - model_name: gx10-glm53
        litellm_params:
          model: openai/nvidia/GLM-5.3-Flash-FP4-Local
          api_base: http://freki.internal:8000/v1
          api_key: "EMPTY"

      # --- Always-On OpenAI Image Generation (freki:8091) ---
      - model_name: gx10-image
        litellm_params:
          model: openai/Qwen/Qwen-Image-2.1-Turbo
          api_base: http://freki.internal:8091/v1
          api_key: "EMPTY"
        model_info:
          mode: image_generation

    # System 1 (Jev-like) decision endpoint (Laya — ModernBERT-large, <1.5 GB, ~5-20ms):
    #   POST http://freki.internal:8092/predict
    #   GET  http://freki.internal:8092/health

    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      store_model_in_db: true
    router_settings:
      fallbacks:
        - gx10-fast-abliterated: ["gx10-coding-abliterated"]
        - gx10-fast: ["gx10-coding"]
    litellm_settings:
      drop_params: true
      callbacks: ["prometheus"]
