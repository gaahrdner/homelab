apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    model_list:
      - model_name: ds4-vision
        litellm_params:
          model: openai/deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
          api_base: http://192.168.0.123:8000/v1
          api_key: dummy
      - model_name: ds4-plan
        litellm_params:
          model: openai/deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
          api_base: http://192.168.0.123:8000/v1
          api_key: dummy
      - model_name: ds4-review
        litellm_params:
          model: openai/deepseek-ai/DeepSeek-V4-Flash-Vision-Exp
          api_base: http://192.168.0.123:8000/v1
          api_key: dummy
      - model_name: together-mayor
        litellm_params:
          model: together_ai/moonshotai/Kimi-K2.6
          api_key: os.environ/TOGETHER_API_KEY
      - model_name: together-hardcode
        litellm_params:
          model: together_ai/zai-org/GLM-5.1
          api_key: os.environ/TOGETHER_API_KEY
    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
    litellm_settings:
      database_url: os.environ/DATABASE_URL
      callbacks: ["prometheus", "langfuse_otel"]
