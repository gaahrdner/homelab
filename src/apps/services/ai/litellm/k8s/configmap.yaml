apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: litellm
data:
  config.yaml: |
    # Drop-in model_list snippet for litellm.internal
    # Matches the Split Dual-Lane default AND Linked TP=2 modes managed via http://freki.internal:8080

    model_list:
      # --- Split Dual-Lane: Dedicated Coding Workhorse (geri:8000) ---
      - model_name: gx10-coding
        litellm_params:
          model: openai/nvidia/Qwen3.8-27B-NVFP4
          api_base: http://geri.internal:8000/v1
          api_key: "EMPTY"

      # --- Split Dual-Lane: Fast Chat / Reasoning / Vision (freki:8000) ---
      - model_name: gx10-fast
        litellm_params:
          model: openai/thinkingmachines/Inkling-2-Mini
          api_base: http://freki.internal:8000/v1
          api_key: "EMPTY"

      # --- Split Dual-Lane Alternates (when swapped via Web Control Panel) ---
      - model_name: gx10-nemotron
        litellm_params:
          model: openai/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-NVFP4
          api_base: http://geri.internal:8000/v1
          api_key: "EMPTY"

      - model_name: gx10-gemma4
        litellm_params:
          model: openai/nvidia/Gemma-4-26B-A4B-NVFP4
          api_base: http://freki.internal:8000/v1
          api_key: "EMPTY"

      # --- Linked TP=2 Frontier Modes (served on freki:8000 across both GX10s) ---
      - model_name: gx10-qwen38-next
        litellm_params:
          model: openai/nvidia/Qwen3.8-Flash-Next-FP4-Local
          api_base: http://freki.internal:8000/v1
          api_key: "EMPTY"

      - model_name: gx10-glm53
        litellm_params:
          model: openai/nvidia/GLM-5.3-Flash-FP4-Local
          api_base: http://freki.internal:8000/v1
          api_key: "EMPTY"

      - model_name: gx10-inkling-small
        litellm_params:
          model: openai/thinkingmachines/Inkling-Small-NVFP4
          api_base: http://freki.internal:8000/v1
          api_key: "EMPTY"

      # --- Always-On OpenAI Image Generation (freki:8091) ---
      - model_name: gx10-image
        litellm_params:
          model: openai/Qwen/Qwen-Image-2.1-Turbo
          api_base: http://freki.internal:8091/v1
          api_key: "EMPTY"

    # System 1 (Jev-like) decision endpoint (Laya — ModernBERT-large, <1.5 GB, ~5-20ms):
    #   POST http://freki.internal:8092/predict
    #   GET  http://freki.internal:8092/health

    general_settings:
      master_key: os.environ/PROXY_MASTER_KEY
    litellm_settings:
      callbacks: ["prometheus"]
