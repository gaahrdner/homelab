apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: open-webui
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://helm.openwebui.com
      chart: open-webui
      targetRevision: 18.5.0
      helm:
        releaseName: open-webui
        valuesObject:
          annotations:
            reloader.stakater.com/auto: "true"
          ollama:
            enabled: false
          pipelines:
            enabled: false
          tika:
            enabled: false
          terminals:
            enabled: false
          replicaCount: 1
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 2Gi
          image:
            tag: v0.13.4
            pullPolicy: IfNotPresent
          service:
            type: ClusterIP
            port: 80
          persistence:
            enabled: true
            size: 10Gi
            accessModes:
              - ReadWriteOnce
            storageClass: longhorn
          enableOpenaiApi: true
          openaiBaseApiUrl: http://litellm.litellm.svc.cluster.local:4000/v1
          openaiApiKeyExistingSecret: litellm-master-key
          openaiApiKeyExistingSecretKey: master-key
          extraEnvVars:
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: open-webui-secret
                  key: WEBUI_SECRET_KEY
            - name: ENABLE_IMAGE_GENERATION
              value: "true"
            - name: IMAGE_GENERATION_ENGINE
              value: "openai"
            - name: IMAGE_GENERATION_MODEL
              value: "gx10-image"
            - name: IMAGE_SIZE
              value: "1024x1024"
            - name: UVICORN_WORKERS
              value: "1"
    - repoURL: https://github.com/gaahrdner/homelab.git
      targetRevision: HEAD
      path: src/apps/services/ai/open-webui/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: open-webui

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
