apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://langfuse.github.io/langfuse-k8s
      chart: langfuse
      targetRevision: 2.2.5
      helm:
        releaseName: langfuse
        valuesObject:
          langfuse:
            salt:
              secretKeyRef:
                name: langfuse-core-secrets
                key: salt
            nextauth:
              url: http://langfuse.internal
              secret:
                secretKeyRef:
                  name: langfuse-core-secrets
                  key: nextauth-secret
            encryptionKey:
              secretKeyRef:
                name: langfuse-core-secrets
                key: encryption-key
            web:
              service:
                type: ClusterIP
                port: 3000
              replicas: 1
              pod:
                additionalEnv:
                  - name: NODE_OPTIONS
                    value: "--max-old-space-size=1280"
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 2Gi
            worker:
              replicas: 1
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1Gi
          postgresql:
            deploy: false
            host: langfuse-postgresql
            port: 5432
            auth:
              username: langfuse
              database: postgres_langfuse
              existingSecret: langfuse-postgresql
              secretKeys:
                userPasswordKey: password
          redis:
            deploy: false
            host: langfuse-redis
            port: 6379
            auth:
              existingSecret: langfuse-redis
              existingSecretPasswordKey: password
          clickhouse:
            deploy: false
            host: langfuse-clickhouse
            httpPort: 8123
            nativePort: 9000
            database: default
            cluster:
              enabled: false
            auth:
              username: default
              existingSecret: langfuse-clickhouse
              existingSecretKey: password
          s3:
            deploy: false
            bucket: langfuse
            region: auto
            endpoint: http://langfuse-s3:9000
            forcePathStyle: true
            accessKeyId:
              secretKeyRef:
                name: langfuse-minio
                key: root-user
            secretAccessKey:
              secretKeyRef:
                name: langfuse-minio
                key: root-password
    - repoURL: https://github.com/gaahrdner/homelab.git
      targetRevision: HEAD
      path: src/apps/services/ai/langfuse/k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: langfuse

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
