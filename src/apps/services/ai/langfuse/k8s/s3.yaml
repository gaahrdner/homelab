apiVersion: v1
kind: Service
metadata:
  name: langfuse-s3
  namespace: langfuse
spec:
  selector:
    app.kubernetes.io/name: langfuse-s3
  ports:
    - name: s3
      port: 9000
      targetPort: 9000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: langfuse-s3
  namespace: langfuse
spec:
  serviceName: langfuse-s3
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: langfuse-s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: langfuse-s3
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.54
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-minio
                  key: root-user
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-minio
                  key: root-password
          command:
            - /bin/sh
            - -ec
            - |
              cat > /tmp/s3.json <<EOF
              {
                "identities": [
                  {
                    "name": "${S3_ACCESS_KEY}",
                    "credentials": [
                      {
                        "accessKey": "${S3_ACCESS_KEY}",
                        "secretKey": "${S3_SECRET_KEY}"
                      }
                    ],
                    "actions": ["Admin", "Read", "Write", "List", "Tagging"]
                  }
                ]
              }
              EOF

              (
                for i in $(seq 1 60); do
                  if wget -q -O /dev/null http://127.0.0.1:8888/ 2>/dev/null; then
                    printf 's3.bucket.create -name langfuse\n' | /usr/bin/weed shell -master=127.0.0.1:9333 -filer=127.0.0.1:8888 >/dev/null 2>&1 || true
                    break
                  fi
                  sleep 2
                done
              ) &

              exec /usr/bin/weed server \
                -dir=/data \
                -master \
                -master.defaultReplication=000 \
                -volume \
                -filer \
                -s3 \
                -s3.port=9000 \
                -s3.config=/tmp/s3.json \
                -ip="${POD_IP}" \
                -ip.bind=0.0.0.0
          ports:
            - name: s3
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /data
          resizePolicy:
            - resourceName: cpu
              restartPolicy: NotRequired
            - resourceName: memory
              restartPolicy: NotRequired
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn
        resources:
          requests:
            storage: 8Gi
