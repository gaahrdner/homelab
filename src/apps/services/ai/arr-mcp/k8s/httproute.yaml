apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: arr-mcp
  namespace: arr-mcp
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - arr-mcp.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: arr-mcp
          port: 6060
