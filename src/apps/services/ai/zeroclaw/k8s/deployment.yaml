apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeroclaw
  namespace: zeroclaw
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zeroclaw
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "42617"
        prometheus.io/path: /metrics
      labels:
        app.kubernetes.io/name: zeroclaw
    spec:
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-data
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /zeroclaw-data/.zeroclaw /zeroclaw-data/data /zeroclaw-data/workspace
              sed "s|__LITELLM_API_KEY__|${LITELLM_API_KEY}|g" /config-template/config.toml > /zeroclaw-data/.zeroclaw/config.toml
              chmod 0600 /zeroclaw-data/.zeroclaw/config.toml
              chown 65534:65534 /zeroclaw-data /zeroclaw-data/.zeroclaw /zeroclaw-data/.zeroclaw/config.toml /zeroclaw-data/data /zeroclaw-data/workspace
          env:
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - CHOWN
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /zeroclaw-data
            - name: config
              mountPath: /config-template/config.toml
              subPath: config.toml
              readOnly: true
      containers:
        - name: zeroclaw
          image: ghcr.io/zeroclaw-labs/zeroclaw:v0.9.0
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: gateway
              containerPort: 42617
          env:
            - name: ZEROCLAW_DATA_DIR
              value: /zeroclaw-data/data
            - name: HOME
              value: /zeroclaw-data
            - name: ZEROCLAW_providers__models__openai__gx10_fast__api_key
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: ZEROCLAW_providers__models__openai__gx10_coding__api_key
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: ZEROCLAW_providers__models__openai__gx10_coding_abliterated__api_key
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: ZEROCLAW_providers__models__openai__gx10_fast_abliterated__api_key
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: ZEROCLAW_providers__models__openai__gx10_huihui_abliterated__api_key
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: ZEROCLAW_providers__models__openai__gx10_nemotron__api_key
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: ZEROCLAW_providers__models__openai__gx10_gemma4__api_key
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: ZEROCLAW_providers__models__openai__gx10_qwen36_fast__api_key
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: ZEROCLAW_providers__models__openai__gx10_qwen38_next_1m__api_key
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: ZEROCLAW_providers__models__openai__gx10_qwen38_next__api_key
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
            - name: ZEROCLAW_providers__models__openai__gx10_glm53__api_key
              valueFrom:
                secretKeyRef:
                  name: litellm-master-key
                  key: master-key
          volumeMounts:
            - name: data
              mountPath: /zeroclaw-data
          readinessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: gateway
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zeroclaw-data
        - name: config
          configMap:
            name: zeroclaw-config
