apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zeroclaw
  namespace: zeroclaw
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - zeroclaw.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: zeroclaw
          port: 80
