apiVersion: v1
kind: ConfigMap
metadata:
  name: zeroclaw-config
  namespace: zeroclaw
data:
  config.toml: |
    schema_version = 4

    [providers.models.openai.auto_router]
    model = "auto_router"
    uri = "http://litellm.litellm.svc.cluster.local:4000/v1"
    wire_api = "chat_completions"
    context_window = 262144
    temperature = 0.7

    [providers.models.openai.gx10_fast]
    model = "gx10-fast"
    uri = "http://litellm.litellm.svc.cluster.local:4000/v1"
    wire_api = "chat_completions"
    context_window = 262144
    temperature = 0.7

    [providers.models.openai.gx10_coding]
    model = "gx10-coding"
    uri = "http://litellm.litellm.svc.cluster.local:4000/v1"
    wire_api = "chat_completions"
    context_window = 262144
    temperature = 0.2

    [providers.models.openai.gx10_coding_abliterated]
    model = "gx10-coding-abliterated"
    uri = "http://litellm.litellm.svc.cluster.local:4000/v1"
    wire_api = "chat_completions"
    context_window = 262144
    temperature = 0.2

    [providers.models.openai.gx10_fast_abliterated]
    model = "gx10-fast-abliterated"
    uri = "http://litellm.litellm.svc.cluster.local:4000/v1"
    wire_api = "chat_completions"
    context_window = 262144
    temperature = 0.7

    [providers.models.openai.gx10_huihui_abliterated]
    model = "gx10-huihui-abliterated"
    uri = "http://litellm.litellm.svc.cluster.local:4000/v1"
    wire_api = "chat_completions"
    context_window = 262144
    temperature = 0.2

    [providers.models.openai.gx10_nemotron]
    model = "gx10-nemotron"
    uri = "http://litellm.litellm.svc.cluster.local:4000/v1"
    wire_api = "chat_completions"
    context_window = 1048576
    temperature = 0.7

    [providers.models.openai.gx10_gemma4]
    model = "gx10-gemma4"
    uri = "http://litellm.litellm.svc.cluster.local:4000/v1"
    wire_api = "chat_completions"
    context_window = 262144
    temperature = 0.7

    [providers.models.openai.gx10_qwen36_fast]
    model = "gx10-qwen36-fast"
    uri = "http://litellm.litellm.svc.cluster.local:4000/v1"
    wire_api = "chat_completions"
    context_window = 262144
    temperature = 0.7

    [providers.models.openai.gx10_qwen38_next_1m]
    model = "gx10-qwen38-next-1m"
    uri = "http://litellm.litellm.svc.cluster.local:4000/v1"
    wire_api = "chat_completions"
    context_window = 1000000
    temperature = 0.7

    [providers.models.openai.gx10_qwen38_next]
    model = "gx10-qwen38-next"
    uri = "http://litellm.litellm.svc.cluster.local:4000/v1"
    wire_api = "chat_completions"
    context_window = 262144
    temperature = 0.7

    [providers.models.openai.gx10_glm53]
    model = "gx10-glm53"
    uri = "http://litellm.litellm.svc.cluster.local:4000/v1"
    wire_api = "chat_completions"
    context_window = 512000
    temperature = 0.7

    [agents.default]
    enabled = true
    model_provider = "openai.auto_router"
    risk_profile = "default"
    runtime_profile = "default"

    [agents.default.workspace]
    path = "/zeroclaw-data/workspace"

    [risk_profiles.default]
    level = "supervised"
    auto_approve = ["file_read", "file_write", "file_edit", "memory_recall", "memory_store", "web_search_tool", "web_fetch", "calculator", "glob_search", "content_search", "image_info", "weather", "git_operations", "tool_search", "browser_open"]

    [runtime_profiles.default]

    [gateway]
    port = 42617
    host = "0.0.0.0"
    allow_public_bind = true
    require_pairing = false
    web_dist_dir = "/usr/share/zeroclawlabs/web/dist"
    websocket_ping_interval_secs = 30

    [tools]
    optional = ["*"]

    [mcp]
    enabled = true

    [[mcp.servers]]
    name = "litellm"
    transport = "http"
    url = "http://litellm.litellm.svc.cluster.local:4000/mcp/"
    headers = { Authorization = "Bearer __LITELLM_API_KEY__" }
    tool_timeout_secs = 300
