apiVersion: v1
kind: Service
metadata:
  name: antigravity-headless
  namespace: antigravity
  labels:
    app.kubernetes.io/name: antigravity
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: antigravity
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: antigravity
  namespace: antigravity
  annotations:
    external-dns.alpha.kubernetes.io/hostname: antigravity.internal
  labels:
    app.kubernetes.io/name: antigravity
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: antigravity
  ports:
    - name: ssh
      port: 22
      targetPort: ssh
      protocol: TCP
