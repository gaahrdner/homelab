apiVersion: apps/v1
kind: Deployment
metadata:
  name: shelfmark
  namespace: books
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: shelfmark
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shelfmark
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: shelfmark
          image: ghcr.io/calibrain/shelfmark:v1.7.2
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8084
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: America/Chicago
            - name: FLASK_PORT
              value: "8084"
            - name: CONFIG_DIR
              value: /config
            - name: LOG_ROOT
              value: /var/log/shelfmark
          volumeMounts:
            - name: config
              mountPath: /config
            - name: library
              mountPath: /books
              subPath: bookdrop
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: shelfmark-config
        - name: library
          persistentVolumeClaim:
            claimName: books-library
---
apiVersion: v1
kind: Service
metadata:
  name: shelfmark
  namespace: books
  labels:
    app.kubernetes.io/name: shelfmark
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: shelfmark
  ports:
    - name: http
      port: 8084
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: shelfmark
  namespace: books
spec:
  parentRefs:
    - name: internal
      namespace: gateway
  hostnames:
    - shelfmark.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: shelfmark
          port: 8084
