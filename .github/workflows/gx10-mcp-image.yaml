name: Build GX10 MCP Server Image

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gx10-mcp-image.yaml
      - src/apps/services/ai/litellm/image/gx10-mcp/**
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: src/apps/services/ai/litellm/image/gx10-mcp/go.sum

      - name: Run unit tests
        working-directory: src/apps/services/ai/litellm/image/gx10-mcp
        run: go test -v -race ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/gaahrdner/gx10-mcp
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: src/apps/services/ai/litellm/image/gx10-mcp
          file: src/apps/services/ai/litellm/image/gx10-mcp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
